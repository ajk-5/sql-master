  <text x="80" y="360" font-family="ui-monospace, monospace" font-size="26" fill="#f0b429">SELECT truth FROM evidence WHERE alibi IS NULL;</text>
  <g font-family="system-ui, sans-serif" font-size="24" fill="#e8eaf0">
